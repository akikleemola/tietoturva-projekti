<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forbidden</title>
</head>
<body>
    {% if "user_id" in session %}
    <p>Logged in as {{ session["username"] }}.</p>
    {% else %}
    <p>You are not logged in.</p>
    {% endif %}

    <h1>Forbidden</h1>
    <p>You do not have permission to access this page.</p>

    <p><a href="/">Home</a></p>
</body>
</html>
