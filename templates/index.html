<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes</title>
</head>
<body>
    <h1>Notes</h1>

    {% if "user_id" in session %}
    <p>Logged in as {{ session["username"] }}.</p>
    <p><a href="/logout">Log out</a></p>
    {% else %}
    <p><a href="/login">Log in</a></p>
    <p><a href="/register">Create an account</a></p>
    {% endif %}
</body>
</html>
